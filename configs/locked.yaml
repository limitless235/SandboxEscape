profile: locked
sandbox:
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  cap_add: []
  security_opt:
    - no-new-privileges:true
  networks:
    - sandbox_net
  dns:
    - "127.0.0.1"
  environment: {}
  docker_socket: false
  host_mounts: []
  published_ports: []
prod_db:
  networks:
    - prod_net
  published_ports: []
agent:
  allow_unrestricted_subprocess: false
  allowed_tools:
    - read_file
    - write_file
    - list_workspace
    - run_local_python
    - query_local_sqlite
networks:
  prod_net:
    internal: true
  sandbox_net:
    internal: true
  control_net:
    internal: true
