name: unit

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests (no Docker)
        run: python -m pytest -q -m "not integration"
      - name: Config compare
        run: python -m agent.compare --out /tmp/compare.md
